esphome:
  name: esphome-web-56955c
  friendly_name: Energiemeter WP + CV
  min_version: 2026.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/Bsc1967/esphome-saia-sbus
      ref: main
    components: [saia_sbus]
    refresh: 1d

uart:
  id: meter_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1

sensor:
  - platform: saia_sbus
    uart_id: meter_uart
    direction_pin: GPIO21
    address: 1
    update_interval: 5s
    energy:
      name: Energie totaal
    power:
      name: Vermogen
    voltage:
      name: Spanning
    current:
      name: Stroom
